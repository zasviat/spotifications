name: 🎧 Crawling latest artists releases and dulicates

on:
  workflow_dispatch:
    inputs:
      crawl-new-releases:
        description: Run new releases crawler
        type: boolean
        default: true
      crawl-duplicates:
        description: Run duplicates crawler
        type: boolean
        default: true
  schedule:
    # Every day at 07:17 UTC = 10:17 Kyiv time in summer (UTC+3), 09:17 in winter (UTC+2)
    - cron: '17 07 * * *'

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Set up virtualenv and install requirements
        run: |
          uv venv .venv
          uv pip install -r requirements.txt

      - name: Crawl & notify about new updates
        if: github.event_name != 'workflow_dispatch' || inputs.crawl-new-releases
        run: |
          source .venv/bin/activate
          python src/crawler.py
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Save .last_crawling_date and .processed_releases_uris files
        if: github.event_name != 'workflow_dispatch' || inputs.crawl-new-releases
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add .last_crawling_date .processed_releases_uris
          git commit -m "[GHA] Update last crawling date" --allow-empty
          git push

      - name: Crawl & notify about playlists duplicates
        if: github.event_name != 'workflow_dispatch' || inputs.crawl-duplicates
        run: |
          source .venv/bin/activate
          python src/duplicates_crawler.py
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Upload crawler logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crawler_logs
          path: logs/
