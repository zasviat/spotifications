name: 💊 Linter

on: push
jobs:
  linter:
    env:
      FLAKE8_REPORT_FILE: flake8_report.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install flake8
        run:
          pip install flake8

      - name: Run linter
        run: |
          flake8 src \
            --config=setup.cfg \
            --output-file=${{ env.FLAKE8_REPORT_FILE }} \
            --exit-zero
          cat ${{ env.FLAKE8_REPORT_FILE }}

      - name: Upload flake8 report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: flake8_report
          path: ${{ env.FLAKE8_REPORT_FILE }}
